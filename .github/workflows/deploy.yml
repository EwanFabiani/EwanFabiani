name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate source
        run: |
          npm ci
          node --check server.js
          node --check script.js
          node --check blog/blog.js

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_KNOWN_HOST: ${{ secrets.SERVER_KNOWN_HOST }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SERVER_KNOWN_HOST" > ~/.ssh/known_hosts

      - name: Copy project to VPS
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='node_modules/' \
            -e "ssh -i ~/.ssh/deploy_key -p $SERVER_PORT -o IdentitiesOnly=yes" \
            ./ "$SERVER_USER@$SERVER_HOST:/srv/portfolio/"

      - name: Install production dependencies and restart
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" \
            -o IdentitiesOnly=yes \
            "$SERVER_USER@$SERVER_HOST" \
            'export NVM_DIR="$HOME/.nvm" && . "$NVM_DIR/nvm.sh" && nvm use 24 >/dev/null && cd /srv/portfolio && npm ci --omit=dev && sudo -n /usr/bin/systemctl restart portfolio.service && sudo -n /usr/bin/systemctl is-active --quiet portfolio.service'
